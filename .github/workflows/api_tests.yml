name: API Tests

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:


jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run API tests
        env:
          BASE_APP_URL: ${{ secrets.BASE_APP_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: uv run pytest tests/api/ -v --tb=short

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-html-report
          path: test_result/report.html
          retention-days: 14
