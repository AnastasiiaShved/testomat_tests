name: API Tests

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:


jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run API tests
        env:
          BASE_APP_URL: ${{ secrets.BASE_APP_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: uv run pytest tests/api/

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: test_result/allure-results/
          retention-days: 14


  publish-report:
    runs-on: ubuntu-latest
    needs: [ api-tests ]
    if: always() && needs.api-tests.result != 'skipped'
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: api-allure-results
          path: allure-results

      - name: Install Allure CLI
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.36.0/allure-2.36.0.tgz | tar -xz
          echo "$PWD/allure-2.36.0/bin" >> $GITHUB_PATH

      - name: Generate Allure report
        run: allure generate allure-results -o pages/allure/api --clean

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
