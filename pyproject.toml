[project]
name = "testomat-tests"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "datamodel-code-generator>=0.57.0",
    "faker==40.11.0",
    "playwright==1.58.0",
    "pydantic>=2.13.4",
    "pytest==8.4.1",
    "pytest-html==4.2.0",
    "pytest-playwright==0.7.2",
    "python-dotenv==1.2.2",
    "requests==2.32.3",
    "selenium>=4.43.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["tests_*.py", "*_test.py", "*_tests.py"]
python_functions = ["test_*"]
norecursedirs = [".git", ".venv", ".claude", "__pycache__", "build", "dist", "*.egg-info"]
addopts = [
    "-v",
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--html=test_result/report.html",
    "--self-contained-html",
]
markers = [
    "smoke: Quick smoke test for basic functionality",
    "regression: Full regression test suite",
    "web: Web UI tests using Playwright",
    "slow: Tests that take longer to execute",
    "api: API tests",
]
console_output_style = "progress"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
xfail_strict = true


[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.datamodel-codegen]
input = "./api-1.yaml"
output = "./src/api/models/models.py"
target-python-version = "3.14"
snake-case-field = true
field-constraints = true

