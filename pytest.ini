[pytest]
minversion = 8.0

testpaths = tests

python_files = tests_*.py *_test.py *_tests.py

python_function = test_*

norecursedis = .git .venv .claude __pycache__ build dist *.egg-info

addopts =
    -v
    -ra
    --strict-markers
    --tb=short
    --headed
    --tracing=retain-on-failure
    --screenshot=on
    --output=test_result/traces/
    --html=test_result/report.html
    --self-contained-html

markers =
    smoke: Quick smoke test for basic functionality
    regression: Full regression test suite
    web: Web UI tests using Playwright
    slow: Tests that take longer to execute

console_output_style = progress
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

xfail_strict = true



